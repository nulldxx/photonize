name: Photonize
options:
  bundleIdPrefix: com.photonize
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: $(ARCHS_STANDARD)
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  # Google's libwebp, SPM-packaged. ImageIO only gained WebP *encoding* in macOS
  # 14, but the deployment target is 13.0, so we vendor the C library to keep
  # Ventura users covered. This package vendors libwebp with a module map and
  # nothing else — no SDWebImage runtime comes along with it.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: "1.3.2"
targets:
  Photonize:
    type: application
    platform: macOS
    sources: [Photonize]
    dependencies:
      - package: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photonize.macos
        INFOPLIST_FILE: Photonize/Info.plist
        CODE_SIGN_ENTITLEMENTS: Photonize/Photonize.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Photonize:
    build:
      targets:
        Photonize: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
